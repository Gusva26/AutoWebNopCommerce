serenity {
    project.name = "Automatizacion DemoWebShop"
    take.screenshots = AFTER_EACH_STEP
}

headless.mode = false

webdriver {
    driver = chrome
    autodownload = true
    timeouts {
        implicitlywait = 2000
        fluentwait = 10000
    }
    capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
            args = [
                "--remote-allow-origins=*",
                "--start-maximized",
                "--ignore-certificate-errors",
                "--incognito",
                "--disable-popup-blocking"
            ]
        }
    }
}

environments {
    default {
        webdriver.base.url = "https://demowebshop.tricentis.com/"
    }
}
